name: Terraform Module Verification

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    static-analysis-and-sec-scan:
        name: Lint, Validate, Scan
        runs-on: ubuntu-latest

        steps:
            - name: checkout repository
              uses: actions/checkout@v4
            
            - name: setup Terraform
              uses: hashicorp/setup-terraform@v3
            
            # format check (validate and lint)
            - name: terraform native check
              id: fmt
              run: terraform fmt -check -recursive

            - name: terraform init and validate
              id: validate
              run: |
                set -e

                echo "Begin scan all modules..."
                MODULE_DIRS=$(find . -type f -name '*.tf' -exec dirname {} \; | sort -u)

                for dir in $MODULE_DIRS; do
                    echo "--------------------------------"
                    echo "Current module: $dir"
                    cd "${dir}"

                    terraform init -backend=false
                    terraform validate

                    cd - > /dev/null
                done
                echo "--------------------------------"
                echo "If this line appears, all modules are good to go."

            - name: security scan # quite new for me
              uses: aquasecurity/tfsec-action@v1.0.3
              with:
                args: --exclude-downloaded-modules